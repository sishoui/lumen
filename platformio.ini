; PlatformIO 工程配置文件 - ESP32-C3FH4 8 路彩虹流水灯 MVP
; 构建：pio run
; 烧录：pio run -t upload
; 串口监视器：pio device monitor (115200)

[env:esp32-c3-devkitm-1]
platform = espressif32@6.7.0
board = esp32-c3-devkitm-1
framework = arduino

; 串口上传/监视端口自动检测，如识别不到可手动指定：
; upload_port = COM3
; monitor_port = COM3
upload_speed = 115200
monitor_speed = 115200

lib_deps =
    fastled/FastLED@3.6.0
    h2zero/NimBLE-Arduino@1.4.2

; WS2812B 用 RMT 驱动，持续刷新需要较大任务栈
board_build.flash_mode = dio
build_flags =
    -D FASTLED_RMT_MEM_DRIVER=1
